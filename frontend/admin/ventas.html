<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas Generales - Panel Admin</title>
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Custom Style -->
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 col-lg-2 side p-3">
        <div class="d-flex align-items-center mb-4 px-2">
          <span class="brand-logo mb-0">AS</span>
          <h5 class="mb-0 side-title">Artesanías Sur</h5>
        </div>
        <div class="small text-white-50 mb-4 px-2 border-bottom border-secondary pb-3">
          <i class="bi bi-shield-lock text-accent"></i> <span id="userBox">Cargando...</span>
        </div>
        <nav class="nav flex-column">
          <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Inicio</a>
          <a href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a>
          <a href="tiendas.html"><i class="bi bi-shop"></i> Tiendas</a>
          <a href="categorias.html"><i class="bi bi-tags"></i> Categorías</a>
          <a href="ventas.html" class="active"><i class="bi bi-receipt"></i> Ventas</a>
          <a href="solicitudes.html"><i class="bi bi-send-check"></i> Solicitudes <span id="navPendingBadge" class="badge text-bg-warning rounded-pill" style="display:none;">0</span></a>
          <a href="layout.html"><i class="bi bi-grid-1x2"></i> Diseño Home</a>
          <hr class="text-white-50">
          <a href="../index.html"><i class="bi bi-globe"></i> Ver Sitio</a>
          <a href="#" onclick="event.preventDefault(); Auth.logout()"><i class="bi bi-box-arrow-right text-danger"></i> Salir</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 p-4 bg-light" style="min-height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="h2 mb-0">Ventas Generales de la Plataforma</h1>
          <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" onclick="load()">
            <i class="bi bi-arrow-clockwise"></i> Actualizar
          </button>
        </div>
        
        <div id="msg"></div>

        <!-- Filter Area -->
        <div class="d-flex flex-wrap gap-2 mb-4 bg-white p-3 rounded-4 shadow-sm border">
          <span class="text-muted d-flex align-items-center me-2"><i class="bi bi-funnel"></i> Filtrar por estado:</span>
          <button class="btn btn-sm btn-outline-secondary rounded-pill active" onclick="filterState('all', this)">Todos</button>
          <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="filterState('nuevo', this)">Nuevo</button>
          <button class="btn btn-sm btn-outline-warning rounded-pill" onclick="filterState('confirmado', this)">Confirmado</button>
          <button class="btn btn-sm btn-outline-warning rounded-pill" onclick="filterState('preparacion', this)">En preparación</button>
          <button class="btn btn-sm btn-outline-success rounded-pill" onclick="filterState('entregado', this)">Entregado</button>
          <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="filterState('cancelado', this)">Cancelado</button>
        </div>

        <div id="list">
          <!-- Dynamically populated via JS -->
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/env.js"></script>
  <script src="../assets/js/app-config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    Auth.role(['admin']);
    Auth.paint();

    let allOrders = [];
    let activeFilter = 'all';

    async function load() {
      // Conteo de solicitudes pendientes para el sidebar
      let pendingRes = await API.get('/solicitudes.php?pending_count=1', true);
      if (pendingRes.success) {
        let badge = document.getElementById('navPendingBadge');
        if (pendingRes.count > 0) {
          badge.textContent = pendingRes.count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }

      let r = await API.get('/pedidos.php', true);
      if (!r.success) return showError('msg', r);
      
      allOrders = r.data || [];
      renderOrders();
    }

    function renderOrders() {
      let filtered = allOrders;
      if (activeFilter !== 'all') {
        filtered = allOrders.filter(o => o.estado === activeFilter);
      }

      list.innerHTML = filtered.map(p => {
        let itemsHtml = (p.items || []).map(i => `
          <div class="d-flex justify-content-between text-secondary py-1 border-bottom border-light small">
            <span>${i.producto} <strong class="text-dark">x${i.cantidad}</strong></span>
            <span>${money(i.precio_unitario * i.cantidad)}</span>
          </div>
        `).join('');

        let stateClass = `badge-state-${p.estado}`;
        let dateStr = new Date(p.fecha_creacion).toLocaleDateString('es-AR', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        // WhatsApp message generator for admin support/notification
        let message = `*Hola ${p.cliente_nombre}!* Te contactamos de administración de *Artesanías Sur* respecto a tu pedido *#${p.id}* en la tienda *${p.tienda}*.\n\n`;
        message += `*Estado:* ${p.estado.toUpperCase()}\n`;
        message += `*Monto total:* ${money(p.total)}\n\n`;
        message += `¿Hay algo en lo que podamos ayudarte?`;
        
        let clientPhone = p.cliente_telefono ? p.cliente_telefono.replace(/[^\d]/g, '') : '';
        let whatsappContactBtn = clientPhone 
          ? `<a href="https://wa.me/${clientPhone}?text=${encodeURIComponent(message)}" target="_blank" class="btn btn-sm btn-success d-inline-flex align-items-center gap-1 rounded-3">
              <i class="bi bi-whatsapp"></i> Soporte Cliente
             </a>` 
          : '';

        return `
          <div class="card border-0 rounded-4 shadow-sm mb-3 overflow-hidden">
            <div class="card-body p-4">
              <div class="row align-items-center g-3">
                <div class="col-md-4">
                  <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="badge text-uppercase font-title px-2.5 py-1.5 ${stateClass} badge-state">${p.estado}</span>
                    <span class="text-muted small">${dateStr}</span>
                  </div>
                  <h5 class="fw-bold mb-1">Pedido #${p.id}</h5>
                  <p class="text-primary small mb-0 fw-bold"><i class="bi bi-shop"></i> Tienda: ${p.tienda || ''}</p>
                </div>
                
                <div class="col-md-4 border-start border-end border-light px-md-4">
                  <span class="text-muted small fw-bold d-block mb-2 text-uppercase">Productos</span>
                  ${itemsHtml}
                  <div class="d-flex justify-content-between mt-2 pt-1">
                    <strong class="text-dark">Total:</strong>
                    <strong class="text-primary fs-5">${money(p.total)}</strong>
                  </div>
                </div>
                
                <div class="col-md-4 text-md-end">
                  <span class="text-muted small fw-bold d-block mb-2 text-uppercase">Comprador</span>
                  <p class="mb-1 text-dark fw-bold">${p.cliente_nombre || 'Cliente Anónimo'}</p>
                  <p class="small text-muted mb-2">${p.cliente_telefono || ''} ${p.cliente_email ? '· ' + p.cliente_email : ''}</p>
                  ${p.observaciones ? `<p class="small text-bg-warning-subtle text-warning-emphasis p-2 border border-warning-subtle rounded-3 text-start mb-3">${p.observaciones}</p>` : ''}
                  
                  <div class="d-flex justify-content-md-end gap-2 mt-2">
                    ${whatsappContactBtn}
                    <select class="form-select form-select-sm rounded-3 w-auto border-secondary-subtle" onchange="estado(${p.id}, this.value)">
                      ${['nuevo','confirmado','preparacion','entregado','cancelado'].map(e => `
                        <option value="${e}" ${p.estado === e ? 'selected' : ''}>${e.toUpperCase()}</option>
                      `).join('')}
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('') || '<div class="alert alert-info py-4 text-center rounded-4">No se encontraron ventas registradas en la plataforma.</div>';
    }

    function filterState(state, btn) {
      activeFilter = state;
      document.querySelectorAll('.btn-group button, .d-flex button').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      renderOrders();
    }

    async function estado(id, estado) {
      let r = await API.put('/pedidos.php?id=' + id, { estado });
      if (!r.success) alert(r.message);
      load();
    }

    load();
  </script>
</body>
</html>
