<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar - Artesanías Sur</title>
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Custom Style -->
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #FAF8F5 0%, #EFEBE4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      border: 0;
      border-radius: var(--border-radius-lg);
      box-shadow: 0 15px 35px rgba(44, 36, 32, 0.08);
      background: #ffffff;
      border: 1px solid rgba(44, 36, 32, 0.04);
      width: 100%;
      max-width: 450px;
      overflow: hidden;
    }
    .auth-header {
      background: #2C2420;
      color: #fff;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .auth-body {
      padding: 2.5rem 2rem;
    }
    .form-control-icon {
      position: relative;
    }
    .form-control-icon i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .form-control-icon input {
      padding-left: 2.75rem;
      border-radius: var(--border-radius-md);
      border: 1px solid rgba(44, 36, 32, 0.15);
      transition: var(--transition-smooth);
      height: 48px;
    }
    .form-control-icon input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(175, 66, 32, 0.15);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="text-white text-decoration-none d-inline-flex align-items-center mb-2">
        <span class="brand-logo mb-0">AS</span>
        <h4 class="mb-0 fw-bold">Artesanías Sur</h4>
      </a>
      <p class="text-white-50 small mb-0">Bienvenido de nuevo. Ingresa a tu panel de control.</p>
    </div>
    
    <div class="auth-body">
      <div id="msg"></div>
      
      <form id="f">
        <div class="mb-3">
          <label class="form-label text-dark small fw-bold">Correo Electrónico</label>
          <div class="form-control-icon">
            <i class="bi bi-envelope"></i>
            <input name="email" type="email" class="form-control" placeholder="ejemplo@correo.com" required autocomplete="email">
          </div>
        </div>
        
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label text-dark small fw-bold mb-0">Contraseña</label>
          </div>
          <div class="form-control-icon">
            <i class="bi bi-lock"></i>
            <input name="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>
        
        <button class="btn btn-dark w-100 py-2 fs-6 mb-3">Iniciar Sesión</button>
      </form>
      
      <div class="text-center mt-4">
        <p class="text-muted small mb-0">¿No tienes cuenta? <a href="registro.html" class="fw-bold text-primary">Regístrate como Vendedor</a></p>
        <hr class="my-3 border-secondary-subtle">
        <a href="index.html" class="text-muted small"><i class="bi bi-arrow-left"></i> Volver a la Tienda</a>
      </div>
    </div>
  </div>

  <script src="assets/js/env.js?v=20260605"></script>
  <script src="assets/js/app-config.js?v=20260605"></script>
  <script src="assets/js/api.js?v=20260605"></script>
  <script src="assets/js/auth.js?v=20260605"></script>
  <script>
    f.onsubmit = async e => {
      e.preventDefault();
      
      // Visual feedback: disable button
      const submitBtn = f.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Ingresando...`;
      
      let r = await API.post('/auth.php?action=login', Object.fromEntries(new FormData(f)));
      
      if (!r.success) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar Sesión';
        return showError('msg', r);
      }
      
      Auth.save(r);
      const targetUrl = r.user.rol === 'admin' ? 'admin/dashboard.html' : 'panel/dashboard.html';
      location.href = window.AppConfig && typeof window.AppConfig.resolveUrl === 'function' ? window.AppConfig.resolveUrl(targetUrl) : targetUrl;
    }
  </script>
</body>
</html>
