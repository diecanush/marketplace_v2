<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios y Roles - Panel Admin</title>
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Custom Style -->
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 col-lg-2 side p-3">
        <div class="d-flex align-items-center mb-4 px-2">
          <span class="brand-logo mb-0">AS</span>
          <h5 class="mb-0 side-title">Artesanías Sur</h5>
        </div>
        <div class="small text-white-50 mb-4 px-2 border-bottom border-secondary pb-3">
          <i class="bi bi-shield-lock text-accent"></i> <span id="userBox">Cargando...</span>
        </div>
        <nav class="nav flex-column">
          <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Inicio</a>
          <a href="usuarios.html" class="active"><i class="bi bi-people"></i> Usuarios</a>
          <a href="tiendas.html"><i class="bi bi-shop"></i> Tiendas</a>
          <a href="categorias.html"><i class="bi bi-tags"></i> Categorías</a>
          <a href="ventas.html"><i class="bi bi-receipt"></i> Ventas</a>
          <a href="solicitudes.html"><i class="bi bi-send-check"></i> Solicitudes <span id="navPendingBadge" class="badge text-bg-warning rounded-pill" style="display:none;">0</span></a>
          <a href="layout.html"><i class="bi bi-grid-1x2"></i> Diseño Home</a>
          <hr class="text-white-50">
          <a href="../index.html"><i class="bi bi-globe"></i> Ver Sitio</a>
          <a href="#" onclick="event.preventDefault(); Auth.logout()"><i class="bi bi-box-arrow-right text-danger"></i> Salir</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 p-4 bg-light" style="min-height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="h2 mb-0">Usuarios y Roles</h1>
          <span class="text-muted small">Administra los accesos y los roles globales en la plataforma.</span>
        </div>
        
        <div id="msg"></div>

        <div class="card border-0 rounded-4 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th scope="col" style="border-top-left-radius:12px; padding: 1rem;">Nombre</th>
                    <th scope="col" style="padding: 1rem;">Correo Electrónico</th>
                    <th scope="col" style="padding: 1rem;">Rol</th>
                    <th scope="col" style="padding: 1rem;">Estado Cuenta</th>
                    <th scope="col" style="padding: 1rem;">Fecha de Registro</th>
                    <th scope="col" class="text-end" style="border-top-right-radius:12px; padding: 1rem; width: 120px;">Acciones</th>
                  </tr>
                </thead>
                <tbody id="list">
                  <!-- Rendered via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js?v=1.0.2"></script>
  <script>
    Auth.role(['admin']);
    Auth.paint();

    async function load() {
      // Conteo de solicitudes pendientes para el sidebar
      let pendingRes = await API.get('/solicitudes.php?pending_count=1', true);
      if (pendingRes.success) {
        let badge = document.getElementById('navPendingBadge');
        if (pendingRes.count > 0) {
          badge.textContent = pendingRes.count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }

      let r = await API.get('/usuarios.php', true);
      if (!r.success) return showError('msg', r);
      
      list.innerHTML = (r.data || []).map(u => {
        let regDate = new Date(u.fecha_registro).toLocaleDateString('es-AR', {
          day: '2-digit', month: '2-digit', year: 'numeric'
        });
        
        return `
          <tr>
            <td style="padding: 1rem;" class="fw-bold">${u.nombre}</td>
            <td style="padding: 1rem;" class="text-muted small">${u.email}</td>
            <td style="padding: 1rem;">
              <select class="form-select form-select-sm border-secondary-subtle" id="rol${u.id}" style="width:130px;">
                <option value="admin" ${u.rol === 'admin' ? 'selected' : ''}>ADMIN</option>
                <option value="vendedor" ${u.rol === 'vendedor' ? 'selected' : ''}>VENDEDOR</option>
                <option value="cliente" ${u.rol === 'cliente' ? 'selected' : ''}>CLIENTE</option>
              </select>
            </td>
            <td style="padding: 1rem;">
              <div class="form-check form-switch mb-0">
                <input id="act${u.id}" class="form-check-input" type="checkbox" role="switch" ${u.activo == 1 ? 'checked' : ''}>
                <label class="form-check-label small" for="act${u.id}">${u.activo == 1 ? 'Activa' : 'Suspendida'}</label>
              </div>
            </td>
            <td style="padding: 1rem;" class="text-muted small">${regDate}</td>
            <td class="text-end" style="padding: 1rem;">
              <div class="d-flex justify-content-end gap-1">
                <button class="btn btn-sm btn-dark" onclick="save(${u.id})"><i class="bi bi-save"></i> Guardar</button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${u.id})"><i class="bi bi-trash"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="6" class="text-center py-4 text-muted">No hay usuarios registrados.</td></tr>';
    }

    async function save(id) {
      const btn = event.target.closest('button');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span>`;

      let d = {
        rol: document.getElementById('rol' + id).value,
        activo: document.getElementById('act' + id).checked
      };
      
      let r = await API.put('/usuarios.php?id=' + id, d);
      
      if (!r.success) {
        alert(r.message);
        load();
        return;
      }
      
      alert('¡Usuario actualizado con éxito!');
      load();
    }

    async function del(id) {
      if (confirm('¿Seguro que deseas eliminar este usuario? Si es un vendedor, se eliminará su tienda y todos sus productos asociados de forma permanente.')) {
        let r = await API.del('/usuarios.php?id=' + id);
        if (!r.success) {
          alert(r.message);
        } else {
          alert('¡Usuario eliminado con éxito!');
        }
        load();
      }
    }

    load();
  </script>
</body>
</html>
