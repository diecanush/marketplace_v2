<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderación de Tiendas - Panel Admin</title>
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Custom Style -->
  <link href="../assets/css/style.css" rel="stylesheet">
  <script>
    (function() {
      const activeTheme = localStorage.getItem('home_theme') || 'tierra_artesanal';
      const themes = {
        tierra_artesanal: {
          '--theme-60': '#af4220', '--theme-30': '#FAF8F5', '--theme-10': '#dfa84a', '--theme-text': '#2C2420',
          '--primary': '#af4220', '--primary-hover': '#8e3215', '--accent': '#dfa84a', '--bg-soft': '#FAF8F5', '--text-dark': '#2C2420'
        },
        minimalista_clara: {
          '--theme-60': '#2d4a43', '--theme-30': '#fcfcfc', '--theme-10': '#e09f67', '--theme-text': '#1a1d20',
          '--primary': '#2d4a43', '--primary-hover': '#1e332e', '--accent': '#e09f67', '--bg-soft': '#fcfcfc', '--text-dark': '#1a1d20'
        },
        comercial_moderna: {
          '--theme-60': '#0d6efd', '--theme-30': '#f8f9fa', '--theme-10': '#fd7e14', '--theme-text': '#212529',
          '--primary': '#0d6efd', '--primary-hover': '#0b5ed7', '--accent': '#fd7e14', '--bg-soft': '#f8f9fa', '--text-dark': '#212529'
        },
        elegante_oscura: {
          '--theme-60': '#c5a880', '--theme-30': '#121212', '--theme-10': '#d4af37', '--theme-text': '#f5f5f7',
          '--primary': '#c5a880', '--primary-hover': '#b0936b', '--accent': '#d4af37', '--bg-soft': '#121212', '--text-dark': '#f5f5f7'
        }
      };
      let vars = themes[activeTheme];
      if (!vars && activeTheme.startsWith('custom_')) {
        try {
          const custom = JSON.parse(localStorage.getItem('custom_themes') || '{}');
          if (custom[activeTheme]) vars = custom[activeTheme].variables;
        } catch(e){}
      }
      if (vars) {
        for (let k in vars) {
          document.documentElement.style.setProperty(k, vars[k]);
        }
      }
    })();
  </script>
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 col-lg-2 side p-3">
        <div class="d-flex align-items-center mb-4 px-2">
          <span class="brand-logo mb-0">AS</span>
          <h5 class="mb-0 side-title">Artesanías Sur</h5>
        </div>
        <div class="small text-white-50 mb-4 px-2 border-bottom border-secondary pb-3">
          <i class="bi bi-shield-lock text-accent"></i> <span id="userBox">Cargando...</span>
        </div>
        <nav class="nav flex-column">
          <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Inicio</a>
          <a href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a>
          <a href="tiendas.html" class="active"><i class="bi bi-shop"></i> Tiendas</a>
          <a href="categorias.html"><i class="bi bi-tags"></i> Categorías</a>
          <a href="ventas.html"><i class="bi bi-receipt"></i> Ventas</a>
          <a href="solicitudes.html"><i class="bi bi-send-check"></i> Solicitudes <span id="navPendingBadge" class="badge text-bg-warning rounded-pill" style="display:none;">0</span></a>
          <a href="layout.html"><i class="bi bi-grid-1x2"></i> Diseño Home</a>
          <a href="campanas.html"><i class="bi bi-megaphone"></i> Campañas</a>
          <hr class="text-white-50">
          <a href="../index.html"><i class="bi bi-globe"></i> Ver Sitio</a>
          <a href="#" onclick="event.preventDefault(); Auth.logout()"><i class="bi bi-box-arrow-right text-danger"></i> Salir</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 p-4 bg-light" style="min-height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="h2 mb-0">Moderación de Tiendas</h1>
          <span class="text-muted small">Control de visibilidad y destaque de emprendedores.</span>
        </div>
        
        <div id="msg"></div>

        <div class="card border-0 rounded-4 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th scope="col" style="border-top-left-radius:12px; padding: 1rem;">Tienda</th>
                    <th scope="col" style="padding: 1rem;">Rubro</th>
                    <th scope="col" style="padding: 1rem;">Vendedor</th>
                    <th scope="col" style="padding: 1rem;">Estado</th>
                    <th scope="col" style="padding: 1rem;">Destacado</th>
                    <th scope="col" style="padding: 1rem;">Activa</th>
                    <th scope="col" class="text-end" style="border-top-right-radius:12px; padding: 1rem; width: 120px;">Acciones</th>
                  </tr>
                </thead>
                <tbody id="list">
                  <!-- Rendered via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/env.js?v=20260605"></script>
  <script src="../assets/js/app-config.js?v=20260605"></script>
  <script src="../assets/js/api.js?v=20260605"></script>
  <script src="../assets/js/auth.js?v=20260605"></script>
  <script src="../js/home-themes.js?v=20260605"></script>
  <script>
    Auth.role(['admin']);
    Auth.paint();

    let tiendasCache = [];

    async function load() {
      // Conteo de solicitudes pendientes para el sidebar
      let pendingRes = await API.get('/solicitudes.php?pending_count=1', true);
      if (pendingRes.success) {
        let badge = document.getElementById('navPendingBadge');
        if (pendingRes.count > 0) {
          badge.textContent = pendingRes.count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }

      let r = await API.get('/tiendas.php', true);
      if (!r.success) return showError('msg', r);
      
      tiendasCache = r.data || [];
      
      list.innerHTML = tiendasCache.map(t => {
        let storeImg = getImgUrl(t.imagen, 2);
        
        return `
          <tr>
            <td style="padding: 1rem;">
              <div class="d-flex align-items-center gap-3">
                <img src="${storeImg}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;">
                <div>
                  <input id="nom${t.id}" class="form-control form-control-sm fw-bold border-secondary-subtle" value="${t.nombre || ''}" style="min-width:180px;">
                  <a href="../tienda.html?id=${t.id}" target="_blank" class="small text-primary text-decoration-none mt-1 d-block"><i class="bi bi-eye"></i> ver tienda pública</a>
                </div>
              </div>
            </td>
            <td style="padding: 1rem;">
              <input id="rub${t.id}" class="form-control form-control-sm border-secondary-subtle" value="${t.rubro || ''}" style="width:130px;">
            </td>
            <td style="padding: 1rem;">
              <span class="text-muted small fw-bold">${t.vendedor || 'Desconocido'}</span>
            </td>
            <td style="padding: 1rem;">
              <select id="est${t.id}" class="form-select form-select-sm border-secondary-subtle" style="width:130px;">
                <option value="activa" ${t.estado === 'activa' ? 'selected' : ''}>ACTIVA</option>
                <option value="pendiente" ${t.estado === 'pendiente' ? 'selected' : ''}>PENDIENTE</option>
                <option value="suspendida" ${t.estado === 'suspendida' ? 'selected' : ''}>SUSPENDIDA</option>
              </select>
            </td>
            <td style="padding: 1rem;">
              <div class="form-check form-switch mb-0">
                <input id="des${t.id}" class="form-check-input" type="checkbox" role="switch" ${t.destacado == 1 ? 'checked' : ''}>
              </div>
            </td>
            <td style="padding: 1rem;">
              <div class="form-check form-switch mb-0">
                <input id="act${t.id}" class="form-check-input" type="checkbox" role="switch" ${t.activa == 1 ? 'checked' : ''}>
              </div>
            </td>
            <td class="text-end" style="padding: 1rem;">
              <div class="d-flex justify-content-end gap-1">
                <button class="btn btn-sm btn-dark" onclick="save(${t.id})"><i class="bi bi-save"></i> Guardar</button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${t.id})"><i class="bi bi-trash"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="7" class="text-center py-4 text-muted">No hay tiendas registradas.</td></tr>';
    }

    async function save(id) {
      const btn = event.target.closest('button');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span>`;

      // Get the existing data from cache
      let store = tiendasCache.find(x => +x.id === +id) || {};
      
      let d = {
        nombre: document.getElementById('nom' + id).value.trim(),
        rubro: document.getElementById('rub' + id).value.trim(),
        descripcion: store.descripcion || 'Tienda de artesanías locales.',
        imagen: store.imagen || '',
        whatsapp: store.whatsapp || '',
        instagram: store.instagram || '',
        destacado: document.getElementById('des' + id).checked,
        activa: document.getElementById('act' + id).checked,
        estado: document.getElementById('est' + id).value
      };
      
      let r = await API.put('/tiendas.php?id=' + id, d);
      
      if (!r.success) {
        alert(r.message);
        load();
        return;
      }
      
      alert('¡Tienda guardada con éxito!');
      load();
    }

    async function del(id) {
      if (confirm('¿Seguro que deseas eliminar esta tienda? Se borrarán de forma permanente todos los productos y el catálogo asociados a ella.')) {
        let r = await API.del('/tiendas.php?id=' + id);
        if (!r.success) {
          alert(r.message);
        } else {
          alert('¡Tienda eliminada con éxito!');
        }
        load();
      }
    }

    load();
  </script>
</body>
</html>
